[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ozon-seller-api-mini"
version = "0.1.0"
description = "Маленький типизированный клиент Ozon Seller API на httpx: товары, остатки по складам, отправления FBS, ретраи на 429"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "sakurajim4" }]
keywords = ["ozon", "seller-api", "marketplace", "httpx", "fbs"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Natural Language :: Russian",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/sakurajim4/ozon-seller-api-mini"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_seller_api_mini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
